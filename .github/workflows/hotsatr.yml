name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found. Installing..."
            sudo dnf install -y maven || sudo apt-get install -y maven
          else
            echo "Maven is already installed"
          fi
          mvn -version

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war

      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar \
            -Dsonar.projectKey=hostar \
            -Dsonar.host.url=$SONAR_HOST \
            -Dsonar.login=$SONAR_LOGIN

  deploy:
    runs-on: [self-hosted, linux]
    needs: build
    environment: production

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: .

      - name: Deploy to Tomcat
        run: |
          WAR_FILE=$(ls *.war | head -n 1)
          CLEAN_HOST=$(echo "${{ secrets.TOMCAT_HOST }}" | sed -e 's|^https*://||' -e 's|/*$||')
          echo "Deploying $WAR_FILE to Tomcat at $CLEAN_HOST..."
          curl -v --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}@${CLEAN_HOST}/manager/text/deploy?path=/myapp&update=true"

      - name: Verify deployment
        run: |
          CLEAN_HOST=$(echo "${{ secrets.TOMCAT_HOST }}" | sed -e 's|^https*://||' -e 's|/*$||')
          curl -I "http://${CLEAN_HOST}/myapp"
